name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Symfony / API Platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idees_cadeaux
          POSTGRES_USER: idees_cadeaux
          POSTGRES_PASSWORD: idees_cadeaux
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://idees_cadeaux:idees_cadeaux@localhost:5432/idees_cadeaux?serverVersion=16&charset=utf8
      APP_SECRET: ci-secret
      JWT_PASSPHRASE: ci-passphrase
      MAILER_DSN: null://null
      # No MinIO service in CI (services: can't run its custom start
      # command reliably); avatar upload is covered by manual testing
      # against docker-compose's minio, not by the automated suite.
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/idees-cadeaux
      STORAGE_BUCKET: idees-cadeaux
      STORAGE_KEY: idees_cadeaux
      STORAGE_SECRET: ci-unused
      STORAGE_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, gd, exif, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - run: composer lint

      - run: php bin/console doctrine:database:create --if-not-exists
      - run: php bin/console doctrine:migrations:migrate --no-interaction

      - run: composer test

  mobile:
    name: Mobile (Ionic Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: cp .env.example .env

      - run: npm run lint

      - run: npm run test:unit -- --run

      - run: npm run build

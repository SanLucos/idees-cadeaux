name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run before every production deployment (deploy.yml).
  workflow_call:

jobs:
  backend:
    name: Backend (Symfony / API Platform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idees_cadeaux
          POSTGRES_USER: idees_cadeaux
          POSTGRES_PASSWORD: idees_cadeaux
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://idees_cadeaux:idees_cadeaux@localhost:5432/idees_cadeaux?serverVersion=16&charset=utf8
      APP_SECRET: ci-secret
      JWT_PASSPHRASE: ci-passphrase
      MAILER_DSN: null://null
      # No S3 service in CI: the test env stores uploads on local disk
      # instead (config/packages/flysystem.yaml, when@test).
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: idees-cadeaux
      STORAGE_KEY: idees_cadeaux
      STORAGE_SECRET: ci-unused
      STORAGE_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, gd, exif, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - run: composer lint

      - run: php bin/console doctrine:database:create --if-not-exists
      - run: php bin/console doctrine:migrations:migrate --no-interaction

      - run: composer test

  mobile:
    name: Mobile (Ionic Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: cp .env.example .env

      - run: npm run lint

      - run: npm run test:unit -- --run

      - run: npm run build

  e2e:
    name: End-to-end (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The local Docker stack (CLAUDE.md > Commandes): verification codes
      # are read from Mailpit, so the worker must send the emails.
      - name: Start the Docker stack
        run: |
          cp .env.example .env
          sed -i "s/^HOST_UID=.*/HOST_UID=$(id -u)/; s/^HOST_GID=.*/HOST_GID=$(id -g)/" .env
          docker compose up -d --build

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Prepare the backend
        run: |
          docker compose exec -T php composer install --no-interaction --no-progress --prefer-dist
          docker compose exec -T php bin/console lexik:jwt:generate-keypair --skip-if-exists
          docker compose exec -T php bin/console doctrine:database:create --if-not-exists
          docker compose exec -T php bin/console doctrine:migrations:migrate --no-interaction
          # Started before vendor/ and the schema existed.
          docker compose restart worker
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ hashFiles('mobile/package-lock.json') }}

      - name: Build the web app
        working-directory: mobile
        run: |
          npm ci
          cp .env.example .env
          npm run build

      # The production build behind `vite preview`, which relays /api like
      # the dev server (one origin, for the web session cookie) without the
      # dev server's first-run dependency optimisation.
      - name: Run Cypress
        working-directory: mobile
        run: |
          npx vite preview --port 5173 --strictPort &
          curl --fail --silent --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://localhost:5173
          npx cypress run

      - name: Screenshots of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: mobile/tests/e2e/screenshots
          if-no-files-found: ignore

      - name: Backend logs
        if: failure()
        run: docker compose logs php nginx worker

# Production deployment on a version tag (docs/DEPLOIEMENT.md):
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Runs the whole CI and builds the php and nginx images (pushed to
# ghcr.io/<owner>/ideescadeaux-{php,nginx}:<tag>) side by side, checks the
# tag is on main, then on the server: fetch the tag, check it out,
# ./deploy-prod.sh (image download, migrations, restart, health check).
# The server never builds: a build there took all its memory. One
# deployment at a time.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY          private key allowed for deploy@frigologie.fr
#   DEPLOY_SSH_KNOWN_HOSTS  output of: ssh-keyscan -p 1138 frigologie.fr
#   VAPID_PUBLIC_KEY        Web Push key pair (spec §11 décision 70), made once
#   VAPID_PRIVATE_KEY       with bin/console app:web-push:generate-keys; never
#                           change it after (every browser would resubscribe)
name: Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build the images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      # Registry names are lowercase; the release and commit are shown in
      # Profil (« Version 0.0.10 · abc1234 »), the image has no .git.
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ideescadeaux" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same builder for both: nginx reuses the web and php stages just built.
      - name: php image (php-fpm and worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          target: php
          push: true
          tags: ${{ steps.meta.outputs.repo }}-php:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_BUILD=${{ steps.meta.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nginx image (web app and public/)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          target: nginx
          push: true
          tags: ${{ steps.meta.outputs.repo }}-nginx:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_BUILD=${{ steps.meta.outputs.build }}

  deploy:
    name: Deploy to ideescadeaux.frigologie.fr
    needs: [ci, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://ideescadeaux.frigologie.fr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName frigologie.fr\n  Port 1138\n  User deploy\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' > ~/.ssh/config

      # The secrets kept by the CI join the server's .env.prod, as Frigologie
      # does: its other values stay as they are. Sent through ssh's input,
      # never on a command line. Without them, the server keeps its own
      # (deploy-prod.sh warns if it has none).
      - name: Web Push keys
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning::No VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY secret: the server's .env.prod is left as it is, and without keys there no push reaches the web app."
            exit 0
          fi
          printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\n' "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" | ssh prod 'set -e
            cd ~/ideescadeaux
            test -f .env.prod
            tmp=$(mktemp)
            trap "rm -f \"$tmp\"" EXIT
            grep -v -E "^VAPID_(PUBLIC|PRIVATE)_KEY=" .env.prod > "$tmp" || true
            cat >> "$tmp"
            # Rewritten in place: the file keeps its owner and rights.
            cat "$tmp" > .env.prod'

      # The job's token (packages: read, valid until the job ends) goes
      # through ssh's input to deploy-prod.sh, which logs in to the registry
      # in a throwaway Docker config. git fetch gets no input: it would eat it.
      - name: Deploy the tag
        env:
          IMAGE_REPO: ${{ needs.images.outputs.repo }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh prod "cd ~/ideescadeaux \
            && git fetch --tags --force origin < /dev/null \
            && git checkout --force --detach '${GITHUB_REF_NAME}' \
            && IMAGE_REPO='${IMAGE_REPO}' IMAGE_TAG='${GITHUB_REF_NAME}' REGISTRY_USER='${GITHUB_ACTOR}' ./deploy-prod.sh"

      - name: Check it is online
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://ideescadeaux.frigologie.fr/api/health

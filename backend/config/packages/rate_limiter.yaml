framework:
    rate_limiter:
        # spec §9 / §5.3: "limitation de débit sur ... demandes d'ami".
        friend_request:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Spec §5.15 invitation codes: on top of the 5 attempts per invitation.
        invitation_accept:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Spec §9 / §5.5: "limitation de débit sur ... aperçu de lien".
        link_preview:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

framework:
    rate_limiter:
        # spec §9 / §5.3: "limitation de débit sur ... demandes d'ami".
        friend_request:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Spec §5.15 invitation codes: on top of the 5 attempts per invitation.
        invitation_accept:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Spec §9 / §5.5: "limitation de débit sur ... aperçu de lien".
        link_preview:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # Spec §5.16 "endpoints publics limités en débit": guest view (API
        # and web page), per IP; its images have their own, larger quota.
        share_link_public:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
        share_link_media:
            policy: sliding_window
            limit: 600
            interval: '10 minutes'
        # Confirmation screen and joining, per signed-in account.
        share_link_join:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

security:
    password_hashers:
        App\Entity\User: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # POST /api/auth/login: email+password in, access+refresh token out.
        # Blocked pre-verification (AppUserChecker) and rate-limited
        # (spec §5.1, §9 "limitation de débit sur connexion").
        login:
            pattern: ^/api/auth/login$
            stateless: true
            user_checker: App\Security\AppUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\Http\JsonAuthenticationFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # POST /api/auth/refresh: rotates the refresh token, issues a new
        # access token (spec §5.1, ~30 days with rotation).
        refresh:
            pattern: ^/api/auth/refresh$
            stateless: true
            provider: app_user_provider
            refresh-jwt:
                check_path: /api/auth/refresh
                failure_handler: App\Security\Http\JsonAuthenticationFailureHandler

        # Everything else under /api: stateless Bearer JWT. Endpoints that
        # don't need a session (register, verify-email, forgot/reset
        # password, social login, the health check) are opened back up
        # below via access_control's PUBLIC_ACCESS entries.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(register|login|refresh|verify-email|forgot-password|reset-password|social)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/(docs|contexts|errors|validation_errors|\.well-known)(/|\.|$), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

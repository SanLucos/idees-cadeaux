nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # X-Acting-As: spec §5.15 (profils enfants gérés), lot 4 bis.
        # Idempotency-Key: offline replays (spec §11 décision 32).
        # X-Request-Id: ties the app's error reports to the server logs (§9).
        allow_headers: ['Content-Type', 'Authorization', 'X-Acting-As', 'Idempotency-Key', 'X-Request-Id']
        expose_headers: ['Link', 'X-Request-Id']
        max_age: 3600
    paths:
        # The mobile app calls the API cross-origin: from the Vite dev
        # server, and from the native WebViews (https://localhost on
        # Android, capacitor://localhost on iOS). The
        # guest web page (spec §5.16, lot 7 bis) is server-rendered,
        # same-origin, and doesn't need this.
        '^/api': {}

framework:
    messenger:
        failure_transport: failed

        transports:
            # Emails, push, RGPD export, link previews (spec §2): a real
            # queue, consumed by the `worker` container, not fire-and-forget.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            App\Message\SendVerificationCodeEmail: async
            App\Message\SendManagedProfileInvitationEmail: async
            App\Message\DeliverNotification: async
            App\Message\SendAccountEmail: async
            App\Message\ExportUserData: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'

# Stockage objet compatible S3 (spec §2/§9) : Garage en local, S3 hébergé
# dans l'UE en prod, via les mêmes variables d'env.
flysystem:
    storages:
        default.storage:
            adapter: 'asyncaws'
            options:
                client: 'AsyncAws\S3\S3Client'
                bucket: '%env(STORAGE_BUCKET)%'

# Tests: local disk instead of S3, so upload tests run in CI (no S3
# service there) — same FilesystemOperator API, no extra dependency.
when@test:
    flysystem:
        storages:
            default.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/storage/test'

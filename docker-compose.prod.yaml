# Production stack, served behind the Traefik of another stack on the same
# server through the external network ${TRAEFIK_NETWORK} (docs/DEPLOIEMENT.md).
# No port is published: nginx is the only service Traefik can reach.
# Uploaded images live in a hosted S3 bucket in the EU (STORAGE_* in .env.prod).
#
#   ./deploy-prod.sh        (reads .env.prod, see .env.prod.example)

# Docker keeps container logs forever by default: cap them.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    target: php
  image: ideescadeaux-php:latest
  restart: unless-stopped
  depends_on:
    - postgres
  env_file: .env.prod
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
    DEFAULT_URI: https://${APP_HOST}
    SHARE_LINK_BASE_URL: https://${APP_HOST}
    MEDIA_BASE_URL: https://${APP_HOST}
    # Requests arrive through Traefik then nginx, both on private Docker
    # networks: trust their X-Forwarded-* headers (client IP, https).
    SYMFONY_TRUSTED_PROXIES: private_ranges
  volumes:
    - ${DATA_DIR}/jwt:/var/www/backend/config/jwt
  labels:
    - traefik.enable=false
  <<: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Host directories rather than Docker volumes: a `docker volume prune`
    # run by another stack on the server can never delete them.
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    labels:
      - traefik.enable=false
    <<: *logging

  # Daily database dump in ${DATA_DIR}/backups, kept 30 days (spec §5.13:
  # backups purged by rotation within 30 days). docker/backup/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      - postgres
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ${DATA_DIR}/backups:/backups
    labels:
      - traefik.enable=false
    <<: *logging

  php:
    <<: *php

  # Same image as php: consumes the async queue and the scheduled tasks.
  worker:
    <<: *php
    command: ["bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600"]

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: nginx
    image: ideescadeaux-nginx:latest
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.ideescadeaux.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.ideescadeaux.entrypoints=websecure
      - traefik.http.routers.ideescadeaux.tls=true
      - traefik.http.routers.ideescadeaux.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.services.ideescadeaux.loadbalancer.server.port=80
    <<: *logging

networks:
  proxy:
    name: ${TRAEFIK_NETWORK}
    external: true

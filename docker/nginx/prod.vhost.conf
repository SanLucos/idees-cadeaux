# Production (docker-compose.prod.yaml): the web app at the root (spec §11
# décision 56), and what Symfony serves under its own paths: the API, the
# media, the server pages and email links, the /u/ link previews.
server {
    listen 80;
    server_name _;
    root /var/www/web;

    # Docker's DNS at request time: php may be recreated (new address).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    client_max_body_size 10m;

    location ~ ^/(api|bundles|media|privacy|exports|unsubscribe|account/cancel-deletion|\.well-known|u)(/|$) {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/backend/public;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Built files carry a hash in their name: cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the web app; its router handles the path.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "DENY";
    }
}

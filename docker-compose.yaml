services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idees_cadeaux}
      POSTGRES_USER: ${POSTGRES_USER:-idees_cadeaux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idees_cadeaux}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # S3-compatible storage for uploads (spec §2), dev only: production
  # uses a hosted S3 (docs/DEPLOIEMENT.md). Bucket and key are created by
  # docker/garage/init.sh at start-up.
  garage:
    build: ./docker/garage
    environment: &storage_credentials
      STORAGE_BUCKET: ${STORAGE_BUCKET:-idees-cadeaux}
      STORAGE_KEY: ${STORAGE_KEY:-GK1dc0de1dc0de1dc0de1dc0de}
      STORAGE_SECRET: ${STORAGE_SECRET:-1dc0de1dc0de1dc0de1dc0de1dc0de1dc0de1dc0de1dc0de1dc0de1dc0de1dc0}
    volumes:
      - garage_data:/var/lib/garage
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"

  php:
    build:
      context: ./docker/php
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    depends_on:
      - postgres
      - mailpit
      - garage
    volumes:
      - ./backend:/var/www/backend
    environment: &php_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-idees_cadeaux}:${POSTGRES_PASSWORD:-idees_cadeaux}@postgres:5432/${POSTGRES_DB:-idees_cadeaux}?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      STORAGE_ENDPOINT: http://garage:3900
      <<: *storage_credentials
      STORAGE_REGION: garage

  # Consumes emails, push, RGPD export and link-preview jobs (spec §2:
  # "tâches asynchrones : Symfony Messenger") plus scheduled tasks
  # (#[AsPeriodicTask], e.g. daily friend-request expiry, spec §5.3).
  # Same image as php.
  worker:
    build:
      context: ./docker/php
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    command: ["bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "-vv"]
    restart: unless-stopped
    depends_on:
      - postgres
      - mailpit
      - garage
    volumes:
      - ./backend:/var/www/backend
    environment: *php_env

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/backend.vhost.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACKEND_LOCAL_PORT:-8000}:80"

volumes:
  postgres_data:
    driver: local
  garage_data:
    driver: local

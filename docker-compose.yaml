services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idees_cadeaux}
      POSTGRES_USER: ${POSTGRES_USER:-idees_cadeaux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idees_cadeaux}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-idees_cadeaux}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-idees_cadeaux_minio}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-idees_cadeaux} ${MINIO_ROOT_PASSWORD:-idees_cadeaux_minio}; do sleep 1; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-idees-cadeaux};
      mc anonymous set none local/${MINIO_BUCKET:-idees-cadeaux};
      "

  php:
    build:
      context: ./docker/php
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    depends_on:
      - postgres
      - mailpit
      - minio
    volumes:
      - ./backend:/var/www/backend
    environment: &php_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-idees_cadeaux}:${POSTGRES_PASSWORD:-idees_cadeaux}@postgres:5432/${POSTGRES_DB:-idees_cadeaux}?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${MINIO_BUCKET:-idees-cadeaux}
      STORAGE_KEY: ${MINIO_ROOT_USER:-idees_cadeaux}
      STORAGE_SECRET: ${MINIO_ROOT_PASSWORD:-idees_cadeaux_minio}
      STORAGE_REGION: us-east-1

  # Consumes emails, push, RGPD export and link-preview jobs (spec §2:
  # "tâches asynchrones : Symfony Messenger") plus scheduled tasks
  # (#[AsPeriodicTask], e.g. daily friend-request expiry, spec §5.3).
  # Same image as php.
  worker:
    build:
      context: ./docker/php
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    command: ["bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "-vv"]
    restart: unless-stopped
    depends_on:
      - postgres
      - mailpit
      - minio
    volumes:
      - ./backend:/var/www/backend
    environment: *php_env

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/backend.vhost.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACKEND_LOCAL_PORT:-8000}:80"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
